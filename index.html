<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Nirvana OS - Console de Management</title>
    <style>
        :root {
            --bg-color: #001f3f;
            --text-color: #f0f0f0;
            --primary-accent: #d4af37;
            --shadow-light: -5px -5px 10px rgba(255, 255, 255, 0.03);
            --shadow-dark: 5px 5px 10px rgba(0, 0, 0, 0.5);
            --inner-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.7), inset -3px -3px 6px rgba(255, 255, 255, 0.01);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .nirvana-container {
            background-color: var(--bg-color);
            padding: 30px;
            border-radius: 30px;
            box-shadow: var(--shadow-light), var(--shadow-dark);
            width: 100%;
            max-width: 600px;
        }

        .logo-title {
            color: var(--primary-accent);
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .section-label {
            color: var(--primary-accent);
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background-color: var(--bg-color);
            color: white;
            box-shadow: var(--inner-shadow);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* --- ZONE DE MODIFICATION RAPIDE --- */
        .mod-box {
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            background: rgba(212, 175, 55, 0.05);
        }

        .btn-gold {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: var(--primary-accent);
            color: #000;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-gold:active { transform: scale(0.98); }

        /* --- TERMINAL & CODE VIEW --- */
        #code-display {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 15px;
            border-radius: 15px;
            height: 200px;
            overflow-y: auto;
            font-size: 12px;
            box-shadow: var(--inner-shadow);
            display: none;
        }

        .success-card {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border: 2px solid var(--primary-accent);
            border-radius: 20px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    </style>
</head>
<body>

<div class="nirvana-container">
    <div class="logo-title">Le Nirvana OS</div>

    <span class="section-label">Projet & Firebase</span>
    <input type="text" id="app-name" placeholder="Nom de l'app (ex: le-nirvana-pro-v2)">
    <textarea id="firebase-config" placeholder="Coller Firebase Config ici..."></textarea>

    <div class="mod-box">
        <span class="section-label">✨ Modification Rapide (Auto-Update)</span>
        <textarea id="quick-mod" style="height: 60px; margin-bottom: 0;" placeholder="Ex: Change la couleur en rouge ou ajoute un bouton..."></textarea>
    </div>

    <button class="btn-gold" onclick="lancerGeneration()">Lancer la mise à jour</button>

    <span class="section-label" style="margin-top:20px;">Code Source Généré :</span>
    <div id="code-display"></div>

    <div id="success-box" class="success-card">
        <p style="color:var(--primary-accent)">✓ DÉPLOIEMENT RÉUSSI</p>
        <a id="final-link" href="#" target="_blank" style="color:white; text-decoration:none; font-weight:bold;">🌍 OUVRIR L'APPLICATION</a>
    </div>
</div>

<script>
function lancerGeneration() {
    const name = document.getElementById('app-name').value;
    const mod = document.getElementById('quick-mod').value;
    const codeDiv = document.getElementById('code-display');
    const successBox = document.getElementById('success-box');
    const finalLink = document.getElementById('final-link');

    if(!name) return alert("Donne un nom à l'application !");

    codeDiv.style.display = 'block';
    codeDiv.innerHTML = "> Analyse des instructions...<br>> Application du correctif : " + (mod || "Initialisation") + "<br>";

    // Simulation de génération de code
    setTimeout(() => {
        codeDiv.innerHTML += "> Génération HTML5/CSS3...<br>> Injection du SDK Firebase...<br>";
        codeDiv.innerHTML += "<code>&lt;html&gt;&lt;body&gt;&lt;h1&gt;Bienvenue sur " + name + "&lt;/h1&gt;...</code><br>";
    }, 1000);

    // Simulation de succès
    setTimeout(() => {
        codeDiv.innerHTML += "> Envoi vers GitHub... OK !";
        successBox.style.display = 'block';
        finalLink.href = "https://nirvana221229.github.io/" + name + "/";
    }, 3000);
}
</script>

</body>
</html>
